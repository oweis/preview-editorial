<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta name="robots" content="noindex"/>
<meta name="referrer" content="strict-origin-when-cross-origin"/>
<meta name="theme-color" content="#f5f5f5"/>
<link rel="icon" type="image/svg+xml" href="/assets/logo/nested-o.svg?v=2"/>
<link rel="apple-touch-icon" href="/assets/logo/apple-touch-icon.png"/>
<title>404 — Oweis Yahya</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;1,6..72,300&amp;family=Inter:wght@400;500&amp;display=swap" rel="stylesheet"/>
<style>
  :root{--canvas:#f5f5f5;--ink:#0c0a09;--pill:#292524;--body:#4e4e4e;--mute:#777169;--hair-strong:#d6d3d1;--card:#fff;color-scheme:light}
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;background:var(--canvas);color:var(--ink);font-family:"Inter",system-ui,sans-serif;font-size:16px;line-height:1.5;letter-spacing:.16px;-webkit-font-smoothing:antialiased}
  body{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden}
  .orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.5;pointer-events:none}
  .o1{width:420px;height:420px;background:#a7e5d3;left:-140px;top:-120px}
  .o2{width:380px;height:380px;background:#f4c5a8;right:-120px;bottom:-140px}
  .wrap{max-width:560px;width:100%;position:relative}
  .eyebrow{font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0 0 12px}
  h1{font-family:"Newsreader","Times New Roman",serif;font-weight:300;font-size:clamp(40px,8vw,64px);line-height:1.05;letter-spacing:-.03em;margin:0 0 16px}
  h1 em{font-style:italic}
  p{margin:0 0 28px;color:var(--body);max-width:44ch}
  .path{font-size:14px;color:var(--mute);margin-bottom:28px;word-break:break-all}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;height:40px;padding:0 20px;border-radius:9999px;font-size:15px;font-weight:500;background:var(--pill);color:#fff;text-decoration:none;border:1px solid var(--pill)}
  .btn--outline{background:transparent;color:var(--ink);border-color:var(--hair-strong)}
  .btn--outline:hover{border-color:var(--ink);background:var(--card)}
  a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>
<span class="orb o1" aria-hidden="true"></span><span class="orb o2" aria-hidden="true"></span>
<main class="wrap">
  <p class="eyebrow">404</p>
  <h1>This page <em>doesn't exist.</em></h1>
  <p>It may have moved, or the link was never right. Head back to the start, or send me a note and I'll point you the right way.</p>
  <p class="path" id="path"></p>
  <div class="row">
    <a class="btn" href="/">Back to home</a>
    <a class="btn btn--outline" href="/#contact">Email me instead</a>
  </div>
</main>
<script>document.getElementById('path').textContent = 'Requested: ' + (location.pathname || '/');</script>
</body></html>
